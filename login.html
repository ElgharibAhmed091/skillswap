<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | SkillSwap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand" dir="ltr"><img src="img/logo.png" alt="شعار SkillSwap"><b>Skill<span>Swap</span></b></a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-light btn-sm">إنشاء حساب</a>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="card auth-card">
      <img src="img/logo.png" alt="" class="logo">
      <h2>مرحباً بعودتك</h2>
      <p class="sub">سجّل دخولك لمتابعة تبادل المهارات</p>

      <form data-validate data-redirect="dashboard.html" novalidate>
        <div class="alert alert-error">يرجى التحقق من البيانات المدخلة</div>
        <div class="alert alert-success">تم تسجيل الدخول بنجاح، جارٍ التحويل...</div>

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" class="form-control" data-rule="email" placeholder="example@email.com">
          <div class="error-msg">أدخل بريداً إلكترونياً صحيحاً</div>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" class="form-control" data-rule="required" placeholder="••••••••">
          <div class="error-msg">كلمة المرور مطلوبة</div>
        </div>

        <div class="form-group" style="display:flex;justify-content:space-between;align-items:center">
          <label style="font-weight:500;margin:0"><input type="checkbox"> تذكرني</label>
          <a href="#">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
      </form>

      <p class="auth-foot">ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
